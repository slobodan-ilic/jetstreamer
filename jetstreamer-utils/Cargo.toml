[package]
name = "jetstreamer-utils"
description = "Support crate for Jetstreamer containing utility functions, types, and ClickHouse integration"
keywords.workspace = true
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
sst-capability-tests = ["dep:rocksdb"]

[lib]
name = "jetstreamer_utils"

[[bin]]
name = "clickhouse-server"
path = "src/clickhouse_server_bin.rs"

[[bin]]
name = "clickhouse-client"
path = "src/clickhouse_client_bin.rs"

[[bin]]
name = "jetstreamer-blockzilla-poh-extract"
path = "src/blockzilla_poh_extract_bin.rs"

[[bin]]
name = "jetstreamer-blockzilla-boundary-collect"
path = "src/blockzilla_boundary_collect_bin.rs"

[[bin]]
name = "jetstreamer-seal-deployment"
path = "src/seal_deployment_bin.rs"

[[bin]]
name = "jetstreamer-focused-capability-probe"
path = "src/focused_capability_probe_bin.rs"

[[bin]]
name = "jetstreamer-focused-package-attest"
path = "src/focused_package_attest_bin.rs"

[[bin]]
name = "jetstreamer-gcs-metadata-observe"
path = "src/gcs_metadata_observe_bin.rs"

[[bin]]
name = "jetstreamer-horizon-boundary-bridge"
path = "src/horizon_boundary_bridge_bin.rs"

[[bin]]
name = "jetstreamer-horizon-retire-scratch"
path = "src/horizon_retire_scratch_bin.rs"

[[bin]]
name = "jetstreamer-horizon-growth-claim"
path = "src/horizon_growth_claim_bin.rs"

[[bin]]
name = "jetstreamer-horizon-retire-failed-diagnostic"
path = "src/horizon_retire_failed_diagnostic_bin.rs"

[[bin]]
name = "jetstreamer-horizon-full-verification-evidence"
path = "src/horizon_full_verification_evidence_bin.rs"

[[bin]]
name = "jetstreamer-horizon-standalone-guard"
path = "src/horizon_standalone_guard_bin.rs"

[[bin]]
name = "jetstreamer-epoch225-bounded-resource"
path = "src/epoch225_bounded_resource_bin.rs"

[[bin]]
name = "jetstreamer-epoch213-private-verify"
path = "src/epoch213_private_verify_bin.rs"

[[bin]]
name = "jetstreamer-horizon-gap-audit"
path = "src/horizon_gap_audit_bin.rs"

[[bin]]
name = "jetstreamer-epoch225-vote-audit"
path = "src/epoch225_vote_audit_bin.rs"

[[test]]
name = "sst_decoder_capability"
path = "tests/sst_decoder_capability.rs"
required-features = ["sst-capability-tests"]

[dependencies]
tokio = { workspace = true, features = ["full"] }
log.workspace = true
tempfile.workspace = true
libc.workspace = true
solana-logger.workspace = true
ctrlc.workspace = true
bs58 = { workspace = true, features = ["alloc"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sha2.workspace = true
anyhow.workspace = true
rocksdb = { version = "0.23", default-features = false, features = ["lz4"], optional = true }

[dev-dependencies]
bincode.workspace = true
